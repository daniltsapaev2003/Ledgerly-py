services:
  app:
    build: .
    ports:
      - "8000:8000"
    environment:
      TINKOFF_TOKEN: "${TINKOFF_TOKEN:-}"
      DEMO_USERNAME: "${DEMO_USERNAME:-demo}"
      DEMO_PASSWORD: "${DEMO_PASSWORD:?Задайте DEMO_PASSWORD в .env}"
      DEMO_EMAIL: "${DEMO_EMAIL:-demo@example.com}"
      POSTGRES_DB: ledgerly
      POSTGRES_USER: ledgerly_user
      POSTGRES_PASSWORD: ledgerly_password
      POSTGRES_HOST: db
      POSTGRES_PORT: 5432
    depends_on:
      db:
        condition: service_healthy

  db:
    image: postgres:16
    environment:
      POSTGRES_DB: ledgerly
      POSTGRES_USER: ledgerly_user
      POSTGRES_PASSWORD: ledgerly_password
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ledgerly_user -d ledgerly"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  postgres_data: