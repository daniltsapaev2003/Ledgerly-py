[project]
name = "ledgerly"
version = "0.1.0"
description = "Add your description here"
requires-python = ">=3.13"
dependencies = [
    "django>=6.1.1",
    "httpx>=0.28.1",
    "psycopg>=3.3.5",
    "python-dotenv>=1.2.3",
    "t-tech-investments>=1.51.0",
]

[project.scripts]
ledgerly = "ledgerly:main"

[build-system]
requires = ["uv_build>=0.12.12,<0.13.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "pytest-django>=4.14.0",
    "ruff>=0.16.6",
]
