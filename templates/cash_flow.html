{% load static %}

<div
    id="cash-flow-chart-card"
    style="
        width: 100%;
        border: 1px solid rgb(220, 220, 220);
        border-radius: 12px;
        background: white;
        padding: 20px;
        box-sizing: border-box;
    "
>
    <div
        style="
            display: flex;
            align-items: center;
            justify-content: space-between;
            margin-bottom: 20px;
        "
    >
        <div
            style="
                font-size: 18px;
                font-weight: 600;
                color: rgb(30, 30, 30);
            "
        >
            Денежный поток
        </div>

        <select
            id="cash-flow-chart-period"
            style="
                height: 34px;
                padding: 0 10px;
                border: 1px solid rgb(210, 210, 210);
                border-radius: 7px;
                background: white;
                font-size: 13px;
                outline: none;
            "
        >
            <option value="FY">FY</option>
            <option value="Q">Q</option>
        </select>
    </div>

    <div
        style="
            width: 100%;
            height: 400px;
        "
    >
        <canvas id="cash-flow-chart"></canvas>
    </div>
</div>

{{ cash_flow_chart|json_script:"cash-flow-chart-data" }}

<script>
(function () {
    const cashFlowChartData = JSON.parse(
        document.getElementById("cash-flow-chart-data").textContent
    );

    const labels = cashFlowChartData.data.map(
        item => item.label
    );

    const datasets = cashFlowChartData.series.map(
        (series, index) => ({
            label: series.label,

            data: cashFlowChartData.data.map(
                item => Number(item[series.key])
            ),

            backgroundColor: [
                "#2563eb",
                "#dc2626",
                "#16a34a",
                "#9333ea",
                "#ea580c"
            ][index],

            borderWidth: 0
        })
    );

    const chart = new Chart(
        document.getElementById("cash-flow-chart"),
        {
            type: "bar",

            data: {
                labels: labels,
                datasets: datasets
            },

            options: {
                responsive: true,
                maintainAspectRatio: false,

                scales: {
                    x: {
                        stacked: false
                    },

                    y: {
                        beginAtZero: true
                    }
                },

                plugins: {
                    legend: {
                        position: "bottom"
                    }
                }
            }
        }
    );

    document
        .getElementById("cash-flow-chart-period")
        .addEventListener("change", async function () {
            const mode = this.value;

            const companyId = "{{ company.id }}";

            const response = await fetch(
                `/company/${companyId}/chart/cash-flow/?mode=${mode}`
            );

            const newChartData = await response.json();

            const newLabels = newChartData.data.map(
                item => item.label
            );

            const newDatasets = newChartData.series.map(
                (series, index) => ({
                    label: series.label,

                    data: newChartData.data.map(
                        item => Number(item[series.key])
                    ),

                    backgroundColor: [
                        "#2563eb",
                        "#dc2626",
                        "#16a34a",
                        "#9333ea",
                        "#ea580c"
                    ][index],

                    borderWidth: 0
                })
            );

            chart.data.labels = newLabels;
            chart.data.datasets = newDatasets;

            chart.update();
        });
})();
</script>
