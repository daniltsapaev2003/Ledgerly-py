{% load static %}

<div
    id="cash-flow-chart-card"
    style="
        width: 100%;
        border: 1px solid rgb(220, 220, 220);
        border-radius: 12px;
        background: white;
        padding: 20px;
        box-sizing: border-box;
    "
>
    <div
        style="
            display: flex;
            align-items: center;
            justify-content: space-between;
            margin-bottom: 20px;
        "
    >
        <div
            style="
                font-size: 18px;
                font-weight: 600;
                color: rgb(30, 30, 30);
            "
        >
            Денежный поток
        </div>

        <select
            id="cash-flow-chart-period"
            style="
                height: 34px;
                padding: 0 10px;
                border: 1px solid rgb(210, 210, 210);
                border-radius: 7px;
                background: white;
                font-size: 13px;
                outline: none;
            "
        >
            <option value="FY">FY</option>
            <option value="Q">Q</option>
        </select>
    </div>

    <div
        style="
            width: 100%;
            height: 400px;
        "
    >
        <canvas
    id="cash-flow-chart"
    data-chart-data="cash-flow-chart-data"
    data-chart-period="cash-flow-chart-period"
    data-chart-url="/company/{{ company.id }}/chart/cash-flow/"
></canvas>
    </div>
</div>

{{ cash_flow_chart|json_script:"cash-flow-chart-data" }}
