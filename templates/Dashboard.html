{% extends "base.html" %}
{% load static %}

{% block title %}Ledgerly — Dashboard{% endblock %}

{% block content %}

<main class="min-h-screen bg-white">

    <div style="min-height: 100vh; display: flex;">

        <aside
            style="
                width: 275px;
                height: 100vh;
                background: white;
                border: 1px solid rgb(197, 197, 197);
                display: flex;
                flex-direction: column;
                overflow: hidden;
            "
        >

            <img
                src="{% static 'attached_assets/LOGO.png' %}"
                alt="Ledgerly"
                class="w-[50px] h-auto mx-auto -mt-4"
            >

            <!-- Search -->
            <div
                style="
                    width: 250px;
                    height: 35px;
                    min-height: 35px;
                    margin: -8px auto 0;
                    display: flex;
                    align-items: center;
                    background: white;
                    border: 1px solid rgb(209, 213, 219);
                    border-radius: 8px;
                    box-sizing: border-box;
                    padding: 0 12px;
                "
            >

                <svg
                    xmlns="http://www.w3.org/2000/svg"
                    width="18"
                    height="18"
                    viewBox="0 0 24 24"
                    fill="none"
                    stroke="rgb(130, 130, 130)"
                    stroke-width="2"
                    stroke-linecap="round"
                    stroke-linejoin="round"
                >
                    <circle cx="11" cy="11" r="7"></circle>
                    <line
                        x1="16.5"
                        y1="16.5"
                        x2="21"
                        y2="21"
                    ></line>
                </svg>

                <input
                    type="text"
                    placeholder="Ticker or name"
                    style="
                        width: 100%;
                        border: none;
                        outline: none;
                        padding-left: 8px;
                        font-size: 14px;
                        background: transparent;
                    "
                >

            </div>

            <!-- Companies scroll -->
            <div
                style="
                    flex: 1;
                    min-height: 0;
                    overflow-y: auto;
                    margin-top: 20px;
                    padding: 0 15px;
                    box-sizing: border-box;
                "
            >

                {% for company in companies %}

                    <div
                        style="
                            height: 42px;
                            min-height: 42px;
                            display: flex;
                            align-items: center;
                            gap: 10px;
                            padding: 0 8px;
                            box-sizing: border-box;
                            cursor: pointer;
                        "
                    >

                        {% if company.logo_path %}

                            <img
                                src="{% static company.logo_path %}"
                                alt="{{ company.ticker }}"
                                style="
                                    width: 28px;
                                    height: 28px;
                                    object-fit: contain;
                                    border-radius: 50%;
                                "
                            >

                        {% else %}

                            <div
                                style="
                                    width: 28px;
                                    height: 28px;
                                    min-width: 28px;
                                    display: flex;
                                    align-items: center;
                                    justify-content: center;
                                    border-radius: 50%;
                                    background: {{ company.logo_color }};
                                    color: white;
                                    font-size: 10px;
                                    font-weight: 600;
                                "
                            >
                                {{ company.ticker|slice:":2" }}
                            </div>

                        {% endif %}

                        <span
                            style="
                                font-size: 14px;
                                color: rgb(40, 40, 40);
                            "
                        >
                            {{ company.ticker }}
                        </span>

                    </div>

                {% endfor %}

            </div>
<!-- Bottom block -->
<div
    style="
        width: 100%;
        height: 50px;
        min-height: 50px;
        border-top: 1px solid rgb(209, 213, 219);
        background: white;
        box-sizing: border-box;
    "
>
</div>
        </aside>

    </div>

</main>

{% endblock %}
