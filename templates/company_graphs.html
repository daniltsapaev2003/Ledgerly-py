{% load static %}

<div
    id="income-chart-card"
    style="
        width: 100%;
        border: 1px solid rgb(220, 220, 220);
        border-radius: 12px;
        background: white;
        padding: 20px;
        box-sizing: border-box;
        margin-top: 24px;
    "
>
    <div
        style="
            display: flex;
            align-items: center;
            justify-content: space-between;
            margin-bottom: 20px;
        "
    >
        <div
            style="
                font-size: 18px;
                font-weight: 600;
                color: rgb(30, 30, 30);
            "
        >
            Profit
        </div>

        <select
            id="income-chart-period"
            style="
                height: 34px;
                padding: 0 10px;
                border: 1px solid rgb(210, 210, 210);
                border-radius: 7px;
                background: white;
                font-size: 13px;
                outline: none;
            "
        >
            <option value="FY">FY</option>
            <option value="Q">Q</option>
        </select>
    </div>

    <div
        style="
            width: 100%;
            height: 400px;
        "
    >
        <canvas id="income-chart"></canvas>
    </div>
</div>

{{ income_chart|json_script:"income-chart-data" }}

<script src="https://cdn.jsdelivr.net/npm/chart.js"></script>

<script>
    const incomeChartData = JSON.parse(
        document.getElementById("income-chart-data").textContent
    );

    const labels = incomeChartData.data.map(
        item => item.label
    );

    const datasets = incomeChartData.series.map(
        (series, index) => ({
            label: series.label,
            data: incomeChartData.data.map(
                item => Number(item[series.key])
            ),
            backgroundColor: [
                "#2563eb",
                "#dc2626",
                "#16a34a",
                "#9333ea",
                "#ea580c",
                "#0891b2"
            ][index],
            borderWidth: 0
        })
    );

    new Chart(
        document.getElementById("income-chart"),
        {
            type: "bar",

            data: {
                labels: labels,
                datasets: datasets
            },

            options: {
                responsive: true,
                maintainAspectRatio: false,

                scales: {
                    x: {
                        stacked: false
                    },

                    y: {
                        beginAtZero: true
                    }
                },

                plugins: {
                    legend: {
                        position: "bottom"
                    }
                }
            }
        }
    );
</script>
