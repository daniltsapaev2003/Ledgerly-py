{% load static %}

<div
    id="company-panel"
    style="
        width: 100%;
        height: 100%;
        background: rgb(248, 249, 252);
        padding: 20px;
        box-sizing: border-box;
        overflow-y: auto;
    "
>
    <div
        id="company-header"
        style="
            width: 100%;
            height: 90px;
            background: white;
            border: 1px solid rgb(209, 213, 219);
            border-radius: 14px;
            box-sizing: border-box;
            display: flex;
            align-items: center;
            padding: 0 18px;
        "
    >
        <div
            id="company-header-logo"
            style="
                width: 70px;
                height: 70px;
                min-width: 70px;
                border-radius: 50%;
                overflow: hidden;
                display: flex;
                align-items: center;
                justify-content: center;
            "
        >
            {% if company.logo_path %}

                <img
                    src="{% static company.logo_path %}"
                    alt="{{ company.name }}"
                    style="
                        width: 70px;
                        height: 70px;
                        object-fit: contain;
                        border-radius: 50%;
                    "
                >

            {% else %}

                <div
                    style="
                        width: 70px;
                        height: 70px;
                        border-radius: 50%;
                        background: {{ company.logo_color }};
                        color: white;
                        display: flex;
                        align-items: center;
                        justify-content: center;
                        font-size: 13px;
                        font-weight: 600;
                    "
                >
                    {{ company.ticker|slice:":2" }}
                </div>

            {% endif %}
        </div>

        <div
            id="company-header-name"
            style="
                margin-left: 12px;
                font-size: 20px;
                font-weight: 500;
                color: rgb(30, 30, 30);
            "
        >
            {{ company.name }}
        </div>

        <div
    id="company-header-price"
    hx-get="/company/{{ company.id }}/price/"
    hx-trigger="load, every 3s"
    hx-target="#company-header-price"
    hx-swap="outerHTML"
    style="
        margin-left: auto;
        font-size: 22px;
        font-weight: 600;
        color: rgb(30, 30, 30);
    "
>
</div>
    </div>

        <div
        id="company-content"
        style="
            width: 100%;
            min-height: calc(100vh - 150px);
            margin-top: 16px;
            background: white;
            border: 1px solid rgb(209, 213, 219);
            border-radius: 14px;
            box-sizing: border-box;
            padding: 24px;
        "
    >

        <div
            id="company-description"
            style="
                width: 100%;
                box-sizing: border-box;
            "
        >
            <div
                style="
                    font-size: 16px;
                    font-weight: 600;
                    color: rgb(30, 30, 30);
                    margin-bottom: 8px;
                "
            >
                О компании: 
            </div>

            <div
                style="
                    font-size: 16px;
                    line-height: 1.6;
                    font-weight: 400;
                    color: rgb(75, 75, 75);
                "
            >
                {% if company.description %}
                    {{ company.description }}
                {% else %}
                    No description available.
                {% endif %}
            </div>
        </div>

        <div
    style="
        width: 100%;
        height: 1px;
        background: rgb(220, 220, 220);
        margin-top: 20px;
        margin-bottom: 20px;
    "
></div>

    </div>


</div>
