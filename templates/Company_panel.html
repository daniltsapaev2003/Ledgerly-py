{% load static %}

<div
    id="company-panel"
    style="
        width: 100%;
        height: 100%;
        background: rgb(248, 249, 252);
        padding: 20px;
        box-sizing: border-box;
        overflow-y: auto;
    "
>
    <div
        id="company-header"
        style="
            width: 100%;
            height: 90px;
            background: white;
            border: 1px solid rgb(209, 213, 219);
            border-radius: 14px;
            box-sizing: border-box;
            display: flex;
            align-items: center;
            padding: 0 18px;
        "
    >
        <div
            id="company-header-logo"
            style="
                width: 70px;
                height: 70px;
                min-width: 70px;
                border-radius: 50%;
                overflow: hidden;
                display: flex;
                align-items: center;
                justify-content: center;
            "
        >
            {% if company.logo_path %}

                <img
                    src="{% static company.logo_path %}"
                    alt="{{ company.name }}"
                    style="
                        width: 70px;
                        height: 70px;
                        object-fit: contain;
                        border-radius: 50%;
                    "
                >

            {% else %}

                <div
                    style="
                        width: 70px;
                        height: 70px;
                        border-radius: 50%;
                        background: {{ company.logo_color }};
                        color: white;
                        display: flex;
                        align-items: center;
                        justify-content: center;
                        font-size: 13px;
                        font-weight: 600;
                    "
                >
                    {{ company.ticker|slice:":2" }}
                </div>

            {% endif %}
        </div>

        <div
            id="company-header-name"
            style="
                margin-left: 12px;
                font-size: 20px;
                font-weight: 500;
                color: rgb(30, 30, 30);
            "
        >
            {{ company.name }}
        </div>

        <div
    id="company-header-price"
    hx-get="/company/{{ company.id }}/price/"
    hx-trigger="load, every 3s"
    hx-target="#company-header-price"
    hx-swap="outerHTML"
    style="
        margin-left: auto;
        font-size: 22px;
        font-weight: 600;
        color: rgb(30, 30, 30);
    "
>
    
</div>
    </div>
</div>
